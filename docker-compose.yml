version: '3.8'

services:
  web:
    image: ${DOCKER_IMAGE}:${BUILD_NUMBER}
    container_name: cicd_assessment_app
    restart: always
    ports:
      - "${APP_PORT}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - app_storage:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app_storage:
    driver: local
